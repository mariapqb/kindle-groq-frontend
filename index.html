<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Kindle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Chat Kindle</h1>
    <p class="subtitle">Asistente de texto ligero</p>

    <form id="chat-form">
      <label for="prompt">Pregunta</label>
      <textarea id="prompt" name="prompt" rows="6" placeholder="Escribe tu pregunta aquí..." required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <section class="response-box">
      <h2>Respuesta</h2>
      <pre id="response">Aquí aparecerá la respuesta...</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
